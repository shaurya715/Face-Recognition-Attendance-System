<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRAS | Face Recognition</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
        }

        .header p {
            color: #cbd5e1;
            margin-top: 5px;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .card h2 {
            margin-bottom: 10px;
            color: #1f2937;
        }

        .card p {
            color: #6b7280;
            margin-bottom: 25px;
        }

        video {
            width: 100%;
            max-width: 640px;
            border-radius: 10px;
            background: #000;
            display: block;
            margin: 20px auto;
        }

        canvas {
            display: none;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin: 5px;
        }

        .start-btn {
            background: #2563eb;
            color: white;
        }

        .capture-btn {
            background: #16a34a;
            color: white;
        }

        .stop-btn {
            background: #dc3545;
            color: white;
        }

        .back-btn {
            background: #6b7280;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        #result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 8px;
            display: none;
            font-size: 17px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .info {
            background: #dbeafe;
            color: #1e40af;
        }
    </style>
</head>

<body>

    <div class="header">
        <div>
            <h1>FRAS</h1>
            <p>Face Recognition Attendance System</p>
        </div>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>
    </div>


    <div class="container">

        <div class="card">

            <h2>Face Recognition</h2>

            <p>
                Start the camera and capture a face to mark attendance.
            </p>

            <video id="camera" autoplay playsinline></video>

            <canvas id="canvas"></canvas>

            <div>

                <button
                    class="start-btn"
                    onclick="startCamera()"
                >
                    Start Camera
                </button>

                <button
                    class="capture-btn"
                    onclick="captureFace()"
                >
                    Capture & Recognize
                </button>

                <button
                    class="stop-btn"
                    onclick="stopCamera()"
                >
                    Stop Camera
                </button>

            </div>

            <div id="result"></div>

            <br>

            <button
                class="back-btn"
                onclick="goToDashboard()"
            >
                Back to Admin Dashboard
            </button>

        </div>

    </div>


<script>

const API_URL = "http://127.0.0.1:8000";

let stream = null;


// Check login
function checkLogin() {

    const token = localStorage.getItem("fras_token");

    if (!token) {
        window.location.href = "index.html";
    }
}


// Start camera
async function startCamera() {

    const result = document.getElementById("result");

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        document.getElementById("camera").srcObject = stream;

        result.style.display = "block";
        result.className = "info";
        result.textContent = "Camera started. Please look at the camera.";

    } catch (error) {

        result.style.display = "block";
        result.className = "error";
        result.textContent =
            "Camera access denied or camera is not available.";

    }
}


// Capture face and recognize
async function captureFace() {

    const video = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const result = document.getElementById("result");

    if (!stream) {

        result.style.display = "block";
        result.className = "error";
        result.textContent = "Please start the camera first.";

        return;
    }


    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const context = canvas.getContext("2d");

    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    result.style.display = "block";
    result.className = "info";
    result.textContent = "Recognizing face...";


    canvas.toBlob(async function(blob) {

        const formData = new FormData();

        formData.append(
            "file",
            blob,
            "face.jpg"
        );


        const token = localStorage.getItem("fras_token");


        try {

            const response = await fetch(
                API_URL + "/recognize",
                {
                    method: "POST",

                    headers: {
                        "Authorization": "Bearer " + token
                    },

                    body: formData
                }
            );


            if (response.status === 401) {

                localStorage.removeItem("fras_token");

                alert("Session expired. Please login again.");

                window.location.href = "index.html";

                return;
            }


            const data = await response.json();


            if (!response.ok) {

                result.className = "error";

                result.textContent =
                    data.detail || "Face recognition failed.";

                return;
            }


            result.className = "success";

            if (data.message) {

                result.textContent = data.message;

            } else {

                result.textContent =
                    "Face recognized successfully.";

            }


        } catch (error) {

            result.className = "error";

            result.textContent =
                "Backend server se connection nahi ho raha.";

        }

    }, "image/jpeg");

}


// Stop camera
function stopCamera() {

    if (stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );

        stream = null;
    }

    document.getElementById("camera").srcObject = null;

    const result = document.getElementById("result");

    result.style.display = "block";
    result.className = "info";
    result.textContent = "Camera stopped.";

}


// Logout
function logout() {

    stopCamera();

    localStorage.removeItem("fras_token");

    window.location.href = "index.html";

}


// Back to admin dashboard
function goToDashboard() {

    stopCamera();

    window.location.href = "index.html";

}


// Check login when page loads
checkLogin();

</script>

</body>
</html>
